name: Capture VEC 2026 final candidate carrier (review only)

on:
  workflow_dispatch:
    inputs:
      vec_file_url:
        description: "Optional exact VEC candidate spreadsheet URL if discovery fails"
        required: false
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture official spreadsheet with raw SHA256 receipt
        shell: bash
        env:
          VEC_FILE_URL: ${{ inputs.vec_file_url }}
        run: |
          if [[ -n "$VEC_FILE_URL" ]]; then
            node scripts/capture-vec-nominations.mjs --file-url "$VEC_FILE_URL" --output vec-nominations-capture
          else
            node scripts/capture-vec-nominations.mjs --output vec-nominations-capture
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned legacy XLS reader for review-only extraction
        run: python -m pip install 'xlrd==2.0.1'
      - name: Derive privacy-minimised 1,037-candidate review packet
        run: |
          python scripts/extract_vec_nominations.py \
            --file vec-nominations-capture/vec-2026-candidates-raw.xls \
            --receipt vec-nominations-capture/capture-receipt.json \
            --registry metadata/candidates-2026.json \
            --output vec-nominations-capture/review
      - name: Show candidate review totals, without contacts
        if: success()
        run: cat vec-nominations-capture/review/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Display evidence-only receipt
        if: always()
        shell: bash
        run: |
          if [[ -f vec-nominations-capture/capture-receipt.json ]]; then
            cat vec-nominations-capture/capture-receipt.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No carrier receipt produced; inspect the acquisition error." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload raw review carrier and failure diagnostics (never model-admitted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vec-nominations-review-only
          path: vec-nominations-capture/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload privacy-minimised roster and reconciliation review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vec-nominations-candidate-review-only
          path: vec-nominations-capture/review/
          retention-days: 30
          if-no-files-found: warn
