name: Candidate-resolved preference concentration selection

on:
  workflow_dispatch:
  push:
    branches:
      - codex/candidate-resolution-preference-uncertainty
    paths:
      - 'model/scripts/select_candidate_resolved_preference_concentration.py'
      - 'docs/CANDIDATE_RESOLUTION_PREFERENCE_UNCERTAINTY_PROTOCOL.md'
      - 'metadata/candidate-resolution-preference-uncertainty-preregistration-2026-10-29.json'
      - '.github/workflows/candidate-resolution-preference-concentration-select.yml'

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model and numerical dependencies
        run: python -m pip install -c model/constraints.txt -e './model[dev]'
      - name: Regenerate official VEC effective exclusion-parcel evidence
        run: |
          python model/scripts/audit_historical_assembly_effective_transfer_events.py \
            --cache-dir .cache/candidate-resolution-irv \
            --workers 10 \
            --output artifacts/candidate-resolution/historical-effective-transfer-events.json
      - name: Regenerate frozen PR 140 q_oth fit
        run: |
          python model/scripts/fit_oth_candidate_retention_walkforward.py \
            --evidence artifacts/candidate-resolution/historical-effective-transfer-events.json \
            --preregistration metadata/candidate-resolution-irv-preregistration-2026-10-29.json \
            --output artifacts/candidate-resolution/oth-retention-walkforward-fit.json
      - name: Verify PR 140 pre-score freeze
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          freeze = json.loads(Path('metadata/candidate-resolution-irv-qoth-freeze-2026-10-29.json').read_text())
          files = {
              'effectiveTransferEvidenceSha256': Path('artifacts/candidate-resolution/historical-effective-transfer-events.json'),
              'qOthFitSha256': Path('artifacts/candidate-resolution/oth-retention-walkforward-fit.json'),
          }
          for key, path in files.items():
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != freeze[key]:
                  raise SystemExit(f'{key} mismatch: {digest} != {freeze[key]}')
              print(f'{key}: {digest}')
          PY
      - name: Select concentration from training cycles only
        run: |
          python model/scripts/select_candidate_resolved_preference_concentration.py \
            --fit artifacts/candidate-resolution/oth-retention-walkforward-fit.json \
            --output artifacts/candidate-resolution/preference-concentration-selection.json
      - name: Enforce pre-held-out guardrails
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('artifacts/candidate-resolution/preference-concentration-selection.json')
          result = json.loads(path.read_text())
          guard = result['guardrails']
          assert guard['uses2022TargetOutcomeForSelection'] is False
          assert guard['uses2026ForecastOutput'] is False
          assert guard['uses2026SeatPolling'] is False
          assert guard['modifiesPreferenceMeans'] is False
          assert guard['modifiesCandidateResolutionArchitecture'] is False
          print(json.dumps(result['selections'], indent=2, sort_keys=True))
          print('sha256:', hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - name: Upload Gate A selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-resolution-preference-concentration-selection
          path: artifacts/candidate-resolution/*.json
          if-no-files-found: error
