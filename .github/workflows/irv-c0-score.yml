name: IRV C0 historical score

on:
  workflow_dispatch:
  push:
    branches:
      - codex/irv-final-pair-calibration
    paths:
      - 'model/scripts/score_irv_c0_historical.py'
      - 'docs/IRV_FINAL_PAIR_CALIBRATION_PROTOCOL.md'
      - '.github/workflows/irv-c0-score.yml'

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model environment
        run: python -m pip install -c model/constraints.txt -e './model[dev]'
      - name: Score C0 conditional historical IRV
        run: |
          python model/scripts/score_irv_c0_historical.py \
            --simulations 5000 \
            --concentration 72 \
            --seed 20261028 \
            --output artifacts/irv/c0-historical-score.json
      - uses: actions/upload-artifact@v4
        with:
          name: irv-c0-historical-score
          path: artifacts/irv/c0-historical-score.json
          if-no-files-found: error
