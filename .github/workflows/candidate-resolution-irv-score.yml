# Historical scoring gate for preregistered candidate-resolved OTH IRV challenger.
name: Candidate-resolution IRV historical score

on:
  workflow_dispatch:
  push:
    branches:
      - codex/candidate-resolution-irv-calibration
    paths:
      - 'model/scripts/score_candidate_resolved_irv_historical.py'
      - 'model/scripts/fit_oth_candidate_retention_walkforward.py'
      - 'metadata/candidate-resolution-irv-qoth-freeze-2026-10-29.json'
      - 'metadata/candidate-resolution-irv-preregistration-2026-10-29.json'
      - '.github/workflows/candidate-resolution-irv-score.yml'

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model and numerical dependencies
        run: python -m pip install -c model/constraints.txt -e './model[dev]'
      - name: Regenerate official VEC effective exclusion-parcel evidence
        run: |
          python model/scripts/audit_historical_assembly_effective_transfer_events.py \
            --cache-dir .cache/candidate-resolution-irv \
            --workers 10 \
            --output artifacts/candidate-resolution/historical-effective-transfer-events.json
      - name: Regenerate preregistered q_oth fit
        run: |
          python model/scripts/fit_oth_candidate_retention_walkforward.py \
            --evidence artifacts/candidate-resolution/historical-effective-transfer-events.json \
            --preregistration metadata/candidate-resolution-irv-preregistration-2026-10-29.json \
            --output artifacts/candidate-resolution/oth-retention-walkforward-fit.json
      - name: Verify exact pre-score freeze before reading historical outcomes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          freeze = json.loads(Path('metadata/candidate-resolution-irv-qoth-freeze-2026-10-29.json').read_text())
          files = {
              'effectiveTransferEvidenceSha256': Path('artifacts/candidate-resolution/historical-effective-transfer-events.json'),
              'qOthFitSha256': Path('artifacts/candidate-resolution/oth-retention-walkforward-fit.json'),
          }
          for key, path in files.items():
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              expected = freeze[key]
              if digest != expected:
                  raise SystemExit(f'{key} mismatch: {digest} != {expected}')
              print(f'{key}: {digest}')
          PY
      - name: Run matched R0/R1 historical score
        run: |
          python model/scripts/score_candidate_resolved_irv_historical.py \
            --fit artifacts/candidate-resolution/oth-retention-walkforward-fit.json \
            --output artifacts/candidate-resolution/r1-historical-score.json
      - name: Validate production boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('artifacts/candidate-resolution/r1-historical-score.json').read_text())
          guard = result['guardrails']
          assert guard['uses2026ForecastOutput'] is False
          assert guard['uses2026SeatPolling'] is False
          assert guard['fitsNewCrossFamilyMeans'] is False
          assert guard['c0ReproducedToMachineTolerance'] is True
          print(json.dumps(result['supportChecks'], indent=2))
          PY
      - name: Upload historical score and frozen fit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-resolution-irv-historical-score
          path: artifacts/candidate-resolution/*.json
          if-no-files-found: error
