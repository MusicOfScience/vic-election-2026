name: VEC November enrolment impact shadow (no forecast admission)

on:
  pull_request:
    branches: [main]
    paths:
      - 'model/scripts/shadow_vec_november_enrolment.py'
      - 'model/tests/test_vec_november_enrolment_impact.py'
      - '.github/workflows/vec-enrolment-impact-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecast-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned modelling engine, tests and VEC XLS reader
        run: |
          python -m pip install -c model/constraints.txt -e './model[dev]'
          python -m pip install 'xlrd==2.0.2'
      - name: Validate non-mutation and comparison behaviour
        run: python -m pytest model/tests/test_vec_november_enrolment_impact.py -q
      - name: Recover and reconcile exact official 5 November VEC workbook bytes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/capture-vec-enrolment-oct-2026.py --output artifacts/vec-november-source
      - name: Quantify enrolment-only forecast sensitivity with 5000 draws per case
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mkdir -p artifacts/vec-november-impact
          python model/scripts/shadow_vec_november_enrolment.py \
            --review-dir artifacts/vec-november-source \
            --output artifacts/vec-november-impact/forecast-impact-review.json \
            | tee artifacts/vec-november-impact/concise-findings.json
      - name: Validate held decision and all district/region results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/vec-november-impact/forecast-impact-review.json").read_text())
          assert d["status"]=="REVIEW_ONLY_NOT_ADMITTED"
          assert d["experimentalForecastAsOf"]=="2026-10-31"
          assert d["newEnrolmentExtractedDate"]=="2026-11-05"
          assert d["simulationsPerCase"]==5000
          assert len(d["findings"]["allDistrictDeltas"])==88
          assert len(d["findings"]["councilRegionDeltas"])==8
          assert all(value is False for value in d["governance"].values())
          assert abs(sum(d["findings"]["deltaExpectedSeats"].values())) < 1e-8
          assert d["sourceEvidence"]["district"]["newTotal"]==4_725_477
          assert d["sourceEvidence"]["region"]["newTotal"]==4_725_477
          print("Enrolment impact audit passed. This does NOT admit new model inputs.")
          PY
          git diff --exit-code -- model/data model/config model/src metadata/sources.json metadata/accepted-polls-2026.json metadata/release-readiness.generated.json
      - name: Archive full source evidence and separately labelled seat deltas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vec-november-2026-enrolment-impact-review
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
