name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 07:37 AEDT during the 2026 Victorian campaign; follows the source monitor.
    - cron: "37 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse competing branch /docs Jekyll publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pages_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
          if [[ "$pages_type" != "workflow" ]]; then
            echo "::error title=Competing GitHub Pages publishers::Pages is configured for '$pages_type' (branch/Jekyll), while this project requires its Next.js GitHub Actions publisher. Select Settings > Pages > Build and deployment > Source > GitHub Actions to disable /docs Jekyll auto-deploys."
            exit 1
          fi
      - name: Fetch immutable research input trees
        run: |
          git fetch --no-tags --depth=1 origin d254030d9f04066d04d6de280dc5d50700c60d66
          git fetch --no-tags --depth=1 origin 9b32cdae813e1a06f3cda1512d136275604e63a3
      - name: Fetch exact pre-refresh audit baseline
        # Keep checkout shallow; the audit needs this immutable tree, not its history.
        run: git fetch --no-tags --depth=1 origin 8ddf08a1963973397e9d3b1869d658009282fd5f
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -c model/constraints.txt -e './model[dev]'
      - run: bash scripts/refresh-forecast.sh
      - run: git diff --exit-code
      - run: python -m pytest model/tests
      - run: npm test
      - run: npm run lint
      - name: Assess public campaign currency at build time
        run: node scripts/build-campaign-status.mjs --as-of "$(TZ=Australia/Melbourne date +%F)"
      - name: Refresh public analyst discovery feed
        continue-on-error: true
        run: node scripts/build-analyst-live-feed.mjs --output app/analyst-live.generated.json
      - name: Stamp the publicly verifiable build date and source revision
        shell: bash
        run: |
          printf 'NEXT_PUBLIC_SITE_BUILD_SHA=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SITE_BUILD_DATE=%s\n' "$(TZ=Australia/Melbourne date '+%-d %b %Y %H:%M AEDT')" >> "$GITHUB_ENV"
      - run: npx next build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
