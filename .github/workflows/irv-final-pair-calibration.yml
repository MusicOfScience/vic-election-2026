name: IRV final-pair calibration

on:
  workflow_dispatch:
  push:
    branches:
      - codex/irv-final-pair-calibration
    paths:
      - 'model/scripts/audit_historical_assembly_preference_pages.py'
      - 'model/scripts/extract_historical_assembly_original_parcel_transfers.py'
      - 'model/scripts/fit_irv_c1_walkforward.py'
      - 'model/scripts/score_irv_c0_historical.py'
      - 'model/scripts/score_irv_c1_historical.py'
      - 'model/scripts/run_irv_final_pair_shadow.py'
      - 'docs/IRV_FINAL_PAIR_CALIBRATION_PROTOCOL.md'
      - 'docs/IRV_FINAL_PAIR_CALIBRATION_AMENDMENT_1.md'
      - '.github/workflows/irv-final-pair-calibration.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model environment
        run: python -m pip install -c model/constraints.txt -e './model[dev]'
      - name: Audit historical VEC preference-distribution pages
        run: |
          python model/scripts/audit_historical_assembly_preference_pages.py \
            --output artifacts/irv/historical-preference-page-audit.json
      - name: Extract clean first-exclusion transfer evidence
        run: |
          python model/scripts/extract_historical_assembly_original_parcel_transfers.py \
            --output artifacts/irv/historical-original-parcel-transfers.json
      - name: Fit preregistered C1 rows without scoring outcomes
        run: |
          python model/scripts/fit_irv_c1_walkforward.py \
            --evidence artifacts/irv/historical-original-parcel-transfers.json \
            --output artifacts/irv/c1-walkforward-freeze-candidate.json
      - name: Score current C0 preference mechanism on historical outcomes
        run: |
          python model/scripts/score_irv_c0_historical.py \
            --simulations 5000 \
            --concentration 72 \
            --seed 20261028 \
            --output artifacts/irv/c0-historical-score.json
      - name: Upload calibration audit artefacts
        uses: actions/upload-artifact@v4
        with:
          name: irv-final-pair-calibration-audit
          path: artifacts/irv/*.json
          if-no-files-found: error
