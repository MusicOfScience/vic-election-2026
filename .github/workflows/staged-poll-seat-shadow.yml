name: Staged poll full-election shadow

on:
  push:
    branches: [main]
    paths:
      - "model/scripts/run_staged_poll_seat_shadow.py"
      - "model/scripts/run_staged_poll_shadow.py"
      - "model/scripts/run_current_evidence_shadow.py"
      - "model/constraints.txt"
      - "model/src/vicforecast/**"
      - "model/data/processed/poll_events_seed.csv"
      - "model/data/processed/poll_estimates_seed.csv"
      - "metadata/manual-source-evidence-2026.json"
      - "metadata/research-source-evidence-2026.json"
      - "metadata/staged-poll-seat-shadow-2026.json"
      - "metadata/current-evidence-shadow-2026-10-25.json"
      - ".github/workflows/staged-poll-seat-shadow.yml"
  pull_request:
    paths:
      - "model/scripts/run_staged_poll_seat_shadow.py"
      - "model/scripts/run_staged_poll_shadow.py"
      - "model/scripts/run_current_evidence_shadow.py"
      - "model/constraints.txt"
      - "model/src/vicforecast/**"
      - "model/data/processed/poll_events_seed.csv"
      - "model/data/processed/poll_estimates_seed.csv"
      - "metadata/manual-source-evidence-2026.json"
      - "metadata/research-source-evidence-2026.json"
      - "metadata/staged-poll-seat-shadow-2026.json"
      - "metadata/current-evidence-shadow-2026-10-25.json"
      - ".github/workflows/staged-poll-seat-shadow.yml"
  workflow_dispatch:
    inputs:
      simulations:
        description: Simulations per scenario
        required: false
        default: "5000"

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable research input trees
        run: |
          git fetch --no-tags --depth=1 origin d254030d9f04066d04d6de280dc5d50700c60d66
          git fetch --no-tags --depth=1 origin 9b32cdae813e1a06f3cda1512d136275604e63a3
      - name: Prepare original shadow input tree
        run: git worktree add --detach /tmp/frozen-shadow d254030d9f04066d04d6de280dc5d50700c60d66
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c model/constraints.txt -e './model'
      - name: Verify committed historical shadow provenance
        run: node scripts/check-staged-poll-shadow.mjs
      - name: Run historical August staged-poll full-election shadow
        shell: bash
        run: |
          simulations="${{ inputs.simulations }}"
          if [[ -z "${simulations}" ]]; then simulations="5000"; fi
          PYTHONPATH="/tmp/frozen-shadow/model/src" python /tmp/frozen-shadow/model/scripts/run_staged_poll_seat_shadow.py \
            --simulations "${simulations}" \
            --output "$GITHUB_WORKSPACE/staged-poll-seat-shadow.json"
      - uses: actions/upload-artifact@v4
        with:
          name: staged-poll-seat-shadow
          path: staged-poll-seat-shadow.json
          retention-days: 90
      - name: Run 25 October current-evidence full-election shadow
        shell: bash
        run: |
          simulations="${{ inputs.simulations }}"
          if [[ -z "${simulations}" ]]; then simulations="5000"; fi
          PYTHONPATH="/tmp/frozen-shadow/model/src" python /tmp/frozen-shadow/model/scripts/run_current_evidence_shadow.py \
            --simulations "${simulations}" \
            --output "$GITHUB_WORKSPACE/current-evidence-shadow-2026-10-25.json"
      - uses: actions/upload-artifact@v4
        with:
          name: current-evidence-shadow-2026-10-25
          path: current-evidence-shadow-2026-10-25.json
          retention-days: 90
