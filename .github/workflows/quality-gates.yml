name: Forecast quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pre-refresh audit baseline
        # Keep checkout shallow; the audit needs this immutable tree, not its history.
        run: git fetch --no-tags --depth=1 origin 8ddf08a1963973397e9d3b1869d658009282fd5f
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -c model/constraints.txt -e './model[dev]'
      - name: Regenerate deterministic artefacts
        run: bash scripts/refresh-forecast.sh
      - name: Reject uncommitted or timestamp-only drift
        run: git diff --exit-code
      - run: python -m pytest model/tests
      - run: npm run candidates:validate
      - run: npm run psephology:validate
      - run: npm run shadow:check
      - run: npm test
      - run: npm run lint
