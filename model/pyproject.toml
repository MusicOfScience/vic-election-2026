[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vic-election-2026-model"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]
historical-extraction = ["pdfplumber>=0.11", "pypdf>=5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/vicforecast"]

